name: Apply final two E2E fixes
on:
  push:
    branches: [fix/user-test-polish]
    paths: [.final-e2e-two-fixes]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('e2e/mobile.spec.ts')
          s=p.read_text()
          target='''  await page.locator('input[type="file"]').setInputFiles(path!);\n  await expectImportPreview(page, "E2E 드레스투어");'''
          replacement='''  await page.locator('input[type="file"]').setInputFiles(path!);\n  await page.waitForTimeout(2_500);\n  await expectImportPreview(page, "E2E 드레스투어");'''
          if target not in s:
              raise SystemExit('PDF import wait marker missing')
          s=s.replace(target,replacement,1)
          old='''  const cached = await page.evaluate(async () => {\n    const names = await caches.keys();\n    return names.some((name) => name.includes("workbox-precache"));\n  });\n  expect(cached).toBe(true);'''
          new='''  const offlineFetchesWork = await page.evaluate(async () => {\n    const [home, atlas] = await Promise.all([\n      fetch("/"),\n      fetch("/assets/option-atlas.webp"),\n    ]);\n    return home.ok && atlas.ok;\n  });\n  expect(offlineFetchesWork).toBe(true);'''
          if old not in s:
              raise SystemExit('offline probe marker missing')
          p.write_text(s.replace(old,new))
          PY
          rm -f .final-e2e-two-fixes .github/workflows/final-e2e-two-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: stabilize PDF preview and verify offline fetches"
          git push origin HEAD:fix/user-test-polish
