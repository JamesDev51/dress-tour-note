name: Apply generated option artwork

on:
  push:
    branches: [fix/user-test-polish]
    paths:
      - .asset-patch/READY

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate SVG option sprite
        run: node scripts/generate-option-assets.mjs

      - name: Repair one-time patch matcher
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.asset-patch/apply.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          for index, line in enumerate(lines):
              if line.startswith('editor, removed = re.subn('):
                  lines[index] = 'editor, removed = re.subn(r"\\nfunction TinyIcon.*?\\n\\nexport function", "\\n\\nexport function", editor, count=1, flags=re.S)'
                  break
          else:
              raise SystemExit('TinyIcon matcher line not found')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Integrate artwork into the application
        run: python .asset-patch/apply.py

      - name: Install dependencies
        run: npm install

      - name: Format source
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit verified visual assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-patch .github/workflows/apply-option-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete illustrated dress option catalog"
          git push origin HEAD:fix/user-test-polish
