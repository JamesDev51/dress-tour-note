name: Apply generated option assets

on:
  push:
    branches: [fix/user-test-polish]
    paths:
      - .asset-patch/READY

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout asset integration branch
        uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
          fetch-depth: 0

      - name: Apply generated image assets to the app
        run: mkdir -p docs && python .asset-patch/apply.py

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Format integrated source
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build including generated assets
        run: npm run build

      - name: Commit validated asset integration
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-patch .github/workflows/apply-option-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: integrate complete illustrated dress option assets"
          git push origin HEAD:fix/user-test-polish
