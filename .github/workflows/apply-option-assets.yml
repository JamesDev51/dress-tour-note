name: Finalize generated option artwork

on:
  push:
    branches: [fix/user-test-polish]
    paths:
      - .asset-patch/READY

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize and generate SVG sprite
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/generate-option-assets.mjs')
          source = path.read_text(encoding='utf-8')
          source = source.replace(
              'writeFileSync(target, gunzipSync(compressed));',
              'const svg = gunzipSync(compressed).toString("utf8").replace(\' style="display:none"\', "");\nwriteFileSync(target, svg);',
          )
          path.write_text(source, encoding='utf-8')
          PY
          node scripts/generate-option-assets.mjs

      - name: Validate complete artwork catalog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          sprite = Path('public/assets/options.svg').read_text(encoding='utf-8')
          editor = Path('src/features/dress-editor/DressEditorPage.tsx').read_text(encoding='utf-8')
          expected = [
              'common-unknown',
              *[f'top-{x}' for x in ['strapless','offShoulder','spaghetti','wideStrap','halter','oneShoulder','shortSleeve','longSleeve']],
              *[f'neckline-{x}' for x in ['straight','sweetheart','v','square','scoop','high','illusion','asymmetric']],
              *[f'silhouette-{x}' for x in ['aLine','ballGown','fitAndFlare','mermaid','sheath','teaLength']],
              *[f'fabric-{x}' for x in ['mikadoSatin','lace','tulle','organzaChiffon','glitterBeaded','floral3D']],
              *[f'color-{x}' for x in ['pureWhite','ivory','champagne']],
              *[f'train-{x}' for x in ['none','sweep','chapel','cathedral']],
              *[f'waistline-{x}' for x in ['natural','basque','drop','empire']],
              *[f'back-{x}' for x in ['openBack','vBack','buttonBack','corsetBack','illusionBack','bowBack']],
              *[f'detail-{x}' for x in ['corset','draping','waistBow','backBow','pearl','sequin','floral','slit','sheer','detachableSleeve','overskirt','buttons']],
          ]
          missing = [symbol for symbol in expected if f'id="{symbol}"' not in sprite]
          if missing:
              raise SystemExit(f'Missing artwork symbols: {missing}')
          if 'TinyIcon' in editor or 'OptionArtwork' not in editor:
              raise SystemExit('Dress editor is not wired to the generated artwork')
          if 'style="display:none"' in sprite:
              raise SystemExit('External sprite root is still hidden')
          print(f'Validated {len(expected)} generated SVG artworks.')
          PY

      - name: Install dependencies
        run: npm install

      - name: Format source
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and integration tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit verified visual assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-patch .github/workflows/apply-option-assets.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add complete illustrated dress option catalog"
          git push origin HEAD:fix/user-test-polish
