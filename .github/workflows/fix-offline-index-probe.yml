name: Fix offline index probe
on:
  push:
    branches: [fix/user-test-polish]
    paths: [.fix-offline-index-probe]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('e2e/mobile.spec.ts')
          s=p.read_text()
          old='''    const [home, atlas] = await Promise.all([\n      fetch("/"),\n      fetch("/assets/option-atlas.webp"),\n    ]);'''
          new='''    const [home, atlas] = await Promise.all([\n      fetch("/index.html"),\n      fetch("/assets/option-atlas.webp"),\n    ]);'''
          if old not in s:
              raise SystemExit('offline fetch block missing')
          p.write_text(s.replace(old,new,1))
          PY
          rm -f .fix-offline-index-probe .github/workflows/fix-offline-index-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify exact precached index offline"
          git push origin HEAD:fix/user-test-polish
