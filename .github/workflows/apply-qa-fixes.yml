name: Apply E2E and accessibility fixes

on:
  push:
    branches: [fix/user-test-polish]
    paths:
      - .qa-patch-trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
          fetch-depth: 0

      - name: Patch accessible names and browser tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} matches, found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace(
              'src/features/tours/TourDashboardPage.tsx',
              '                  className="flex w-full items-center gap-3 text-left"\n                  onClick={() => nav(`/tour/${tourId}/shop/${s.id}`)}',
              '                  aria-label={`${s.name} 열기`}\n                  className="flex w-full items-center gap-3 text-left"\n                  onClick={() => nav(`/tour/${tourId}/shop/${s.id}`)}',
          )

          replace(
              'src/features/shops/ShopPage.tsx',
              '                    aria-label={`${d.label} 편집`}\n                    className="w-[104px] shrink-0"',
              '                    aria-label={`${d.label} 미리보기 편집`}\n                    className="w-[104px] shrink-0"',
          )
          replace(
              'src/features/shops/ShopPage.tsx',
              '                  <button\n                    className="min-w-0 flex-1 py-1 text-left"',
              '                  <button\n                    aria-label={`${d.label} 상세 편집`}\n                    className="min-w-0 flex-1 py-1 text-left"',
          )
          replace(
              'src/features/shops/ShopPage.tsx',
              '                    aria-label={`${d.label} 편집`}\n                    className="grid h-9 w-9 place-items-center text-stone-400"',
              '                    aria-label={`${d.label} 빠른 편집`}\n                    className="grid h-9 w-9 place-items-center text-stone-400"',
          )

          replace(
              'e2e/mobile.spec.ts',
              'page.getByRole("button", { name: /E2E 브라이덜/ }).click()',
              'page.getByRole("button", { name: "E2E 브라이덜 열기", exact: true }).click()',
              expected=2,
          )
          replace(
              'e2e/mobile.spec.ts',
              'page.getByRole("button", { name: /Dress 01/ }).click()',
              'page.getByRole("button", { name: /Dress 01/ }).first().click()',
              expected=2,
          )
          replace(
              'e2e/usability.spec.ts',
              'page.getByRole("button", { name: /테스트 브라이덜/ }).click()',
              'page.getByRole("button", { name: "테스트 브라이덜 열기", exact: true }).click()',
          )
          replace(
              'e2e/usability.spec.ts',
              '.getByRole("button", { name: /Dress 01 편집/ })\n    .first()',
              '.getByRole("button", { name: "Dress 01 상세 편집", exact: true })',
          )

          replace(
              'vite.config.ts',
              '      workbox: {\n        navigateFallback:',
              '      workbox: {\n        clientsClaim: true,\n        navigateFallback:',
          )

          replace(
              'e2e/mobile.spec.ts',
              '  await context.setOffline(true);\n  await page.reload({ waitUntil: "domcontentloaded" });\n  await expect(page.getByText("그림 대신")).toBeVisible();',
              '  await page.evaluate(async () => {\n    await Promise.all([fetch("/"), fetch("/assets/options.svg")]);\n  });\n  await context.setOffline(true);\n  await page.goto("/?offline-test=1", { waitUntil: "domcontentloaded" });\n  await expect(page.getByText("그림 대신")).toBeVisible();',
          )

          usability = Path('e2e/usability.spec.ts')
          text = usability.read_text(encoding='utf-8')
          marker = 'test("candidate filter never blocks choosing two dresses for comparison"'
          if marker not in text:
              raise SystemExit('asset test insertion marker missing')
          asset_test = '''test("generated option artwork sprite loads and renders in the editor", async ({ page }) => {\n  await createBaseTour(page);\n  const response = await page.request.get("/assets/options.svg");\n  expect(response.ok()).toBe(true);\n  const sprite = await response.text();\n  expect((sprite.match(/<symbol id=/g) ?? []).length).toBe(58);\n  await expect(page.locator('[data-option-art="top-unknown"]')).toBeVisible();\n  await expect(page.locator('[data-option-art="top-offShoulder"]')).toBeVisible();\n});\n\n'''
          usability.write_text(text.replace(marker, asset_test + marker), encoding='utf-8')
          PY

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Commit QA fixes
        shell: bash
        run: |
          rm -f .qa-patch-trigger .github/workflows/apply-qa-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: harden mobile E2E selectors and offline coverage"
          git push origin HEAD:fix/user-test-polish
