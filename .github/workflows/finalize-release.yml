name: Finalize verified visual release

on:
  push:
    branches: [fix/user-test-polish]
    paths:
      - .release-finalize

permissions:
  contents: write

jobs:
  validate-and-promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
          fetch-depth: 0

      - name: Merge latest production branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin master
          git merge --no-edit origin/master

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Recreate generated artwork
        run: npm run assets

      - name: Normalize and verify formatting
        shell: bash
        run: |
          npm run format
          npm run format:check

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Strict TypeScript check
        run: npm run typecheck

      - name: Unit, component, repository, artwork and PDF round-trip tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile user journeys and accessibility
        run: npm run test:e2e

      - name: Repeat mobile user journeys for flake detection
        run: npm run test:e2e -- --repeat-each=2

      - name: Record release evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/RELEASE_VALIDATION.md <<EOF
          # Release validation

          This release was promoted only after the following checks passed on GitHub-hosted Ubuntu with Node 22 and Chromium:

          - deterministic generation of 58 dress-option illustrations
          - Prettier formatting check
          - high-severity npm security audit
          - strict TypeScript typecheck
          - Vitest unit, component, IndexedDB, renderer, artwork and PDF round-trip tests
          - Vite production build and PWA precache generation
          - mobile Playwright user journeys at supported widths
          - WCAG A/AA serious and critical axe checks
          - PDF export, download, recovery import and view-only rejection
          - immediate-navigation autosave and offline reload
          - a second complete E2E pass for flake detection

          Source commit before release evidence: ${GITHUB_SHA}
          EOF
          rm -f .release-finalize .github/workflows/finalize-release.yml
          git add -A
          git commit -m "release: promote fully verified illustrated mobile app"

      - name: Promote the exact verified commit
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:fix/user-test-polish
          git push origin HEAD:master
