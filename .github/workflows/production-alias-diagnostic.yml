name: Production alias diagnostic

on:
  push:
    branches: [test/production-smoke-20260901]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect every likely production alias
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            'https://dress-tour-note-minseokjeongjames-4193s-projects.vercel.app'
            'https://dress-tour-note-git-master-minseokjeongjames-4193s-projects.vercel.app'
            'https://dress-tour-note.vercel.app'
          )
          for base in "${candidates[@]}"; do
            echo "=== $base ==="
            headers=$(mktemp)
            body=$(mktemp)
            code=$(curl -sS -L --max-time 30 -D "$headers" -o "$body" -w '%{http_code}' "$base/" || true)
            echo "FINAL HTTP $code"
            grep -Ei '^(HTTP/|content-type:|location:|x-vercel-)' "$headers" | tail -12 || true
            title=$(grep -Eio '<title>[^<]*</title>' "$body" | head -1 || true)
            echo "TITLE: ${title:-none}"
            echo "APP_ROOT_MARKER: $(grep -c 'id="root"' "$body" || true)"
            aheaders=$(mktemp)
            abody=$(mktemp)
            acode=$(curl -sS -L --max-time 30 -D "$aheaders" -o "$abody" -w '%{http_code}' "$base/assets/option-atlas.webp" || true)
            atype=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{v=$0} END{sub(/^[^:]+:[[:space:]]*/,"",v); sub(/\r$/,"",v); print v}' "$aheaders")
            magic=$(od -An -tx1 -N4 "$abody" | tr -d ' \n')
            echo "ATLAS: HTTP $acode TYPE=${atype:-none} MAGIC=$magic BYTES=$(wc -c < "$abody")"
          done
