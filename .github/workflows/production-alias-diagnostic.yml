name: Production alias diagnostic

on:
  push:
    branches: [test/production-smoke-20260901]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live HTML and static asset
        shell: bash
        run: |
          set -euo pipefail
          base='https://dress-tour-note-minseokjeongjames-4193s-projects.vercel.app'
          curl -sS -L -D /tmp/home.headers "$base/" -o /tmp/home.html
          curl -sS -L -D /tmp/asset.headers "$base/assets/option-atlas.webp" -o /tmp/asset.bin
          echo 'HOME STATUS/TYPE:'
          grep -Ei '^(HTTP/|content-type:|x-vercel-|location:)' /tmp/home.headers || true
          echo 'HOME TITLE:'
          grep -Eio '<title>[^<]*</title>' /tmp/home.html | head -1 || true
          echo 'HOME MARKERS:'
          grep -Eio 'Vercel|Authentication|Log in|Sign in|Dress Tour Note|그드레스|드레스투어|id="root"' /tmp/home.html | sort -u || true
          echo 'ASSET STATUS/TYPE:'
          grep -Ei '^(HTTP/|content-type:|x-vercel-|location:)' /tmp/asset.headers || true
          echo "ASSET BYTES: $(wc -c < /tmp/asset.bin)"
          echo 'ASSET MAGIC:'
          od -An -tx1 -N12 /tmp/asset.bin | tr -s ' '
