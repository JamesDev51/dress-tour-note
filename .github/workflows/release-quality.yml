name: Release quality gate

on:
  push:
    branches: [master]
    paths:
      - .github/release-quality.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  full-quality-gate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit, component, repository, and PDF tests
        run: npm test -- --run

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Mobile end-to-end tests
        run: npm run test:e2e

      - name: Record successful verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/verification.md <<EOF
          # Release verification

          Verified commit: $GITHUB_SHA

          The following checks passed on GitHub-hosted Ubuntu with Node 22:

          - Prettier format check
          - ESLint
          - TypeScript strict typecheck
          - Vitest unit, component, repository, renderer, and PDF round-trip tests
          - Vite production build
          - Playwright Chromium mobile end-to-end tests
          EOF
          rm -f .github/release-quality.trigger .github/workflows/release-quality.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test: record successful full release verification'
          git push origin HEAD:master
