name: Prepare prebuilt static Vercel release

on:
  push:
    branches: [master]
    paths:
      - .prepare-prebuilt-vercel

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout verified master
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source before packaging
        shell: bash
        run: |
          set -euo pipefail
          npm audit --audit-level=high
          npm run typecheck
          npm test
          npm run build
          test -s dist/index.html
          test -s dist/assets/option-atlas.webp
          test -s dist/sw.js

      - name: Configure zero-build static deployment
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          ignore = Path('.gitignore')
          lines = [line for line in ignore.read_text(encoding='utf-8').splitlines() if line.strip() != 'dist']
          ignore.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          path = Path('vercel.json')
          config = json.loads(path.read_text(encoding='utf-8'))
          config['framework'] = None
          config['buildCommand'] = ''
          config['installCommand'] = ''
          config['outputDirectory'] = 'dist'
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Commit the exact verified static bundle
        shell: bash
        run: |
          set -euo pipefail
          rm -f .prepare-prebuilt-vercel .github/workflows/prepare-prebuilt-vercel.yml
          git config user.name '정민석(James)'
          git config user.email 'minseok.jeong.james@gmail.com'
          git add -A
          git add -f dist
          git commit -m 'release: publish verified prebuilt Vercel bundle'
          git push origin HEAD:master
