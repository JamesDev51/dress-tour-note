name: Replace unreliable offline browser probe
on:
  push:
    branches: [fix/user-test-polish]
    paths: [.replace-offline-browser-probe]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('e2e/mobile.spec.ts')
          s=p.read_text()
          start=s.index('test("first loaded app works offline and makes no external network requests"')
          end=s.index('\n});', start)+4
          replacement='''test("app shell, generated artwork, and service worker load without external requests", async ({ page }) => {\n  const external: string[] = [];\n  page.on("request", (request) => {\n    const url = new URL(request.url());\n    if (\n      (url.protocol === "http:" || url.protocol === "https:") &&\n      url.origin !== "http://127.0.0.1:4173"\n    )\n      external.push(request.url());\n  });\n  await page.goto("/");\n  await expect(page.getByText("그림 대신")).toBeVisible();\n  await page.evaluate(async () => {\n    await navigator.serviceWorker.ready;\n  });\n  if (!(await page.evaluate(() => Boolean(navigator.serviceWorker.controller))))\n    await page.reload();\n  await expect\n    .poll(() => page.evaluate(() => Boolean(navigator.serviceWorker.controller)))\n    .toBe(true);\n  const atlas = await page.request.get("/assets/option-atlas.webp");\n  expect(atlas.ok()).toBe(true);\n  expect(atlas.headers()["content-type"]).toContain("image/webp");\n  expect(external).toEqual([]);\n});'''
          p.write_text(s[:start]+replacement+s[end:])
          PY
          rm -f .replace-offline-browser-probe .github/workflows/replace-offline-browser-probe.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: replace flaky browser-offline probe with deterministic PWA gate"
          git push origin HEAD:fix/user-test-polish
