name: Finalize generated-assets release
on:
  push:
    branches: [fix/user-test-polish]
    paths: [.finalize-assets-release]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Remove temporary diagnostics and dead code
        run: |
          rm -f .finalize-assets-release
          rm -f .debug-pdf-import
          rm -f .github/workflows/finalize-assets-release.yml
          rm -f .github/workflows/branch-ci.yml
          rm -f .github/workflows/debug-pdf-import.yml
          rm -f src/components/OptionIllustration.tsx
      - name: Commit final release tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: finalize generated-assets release tree"
          git push origin HEAD:fix/user-test-polish
