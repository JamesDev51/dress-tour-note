name: Apply release blocker fixes
on:
  push:
    branches: [fix/user-test-polish]
    paths: [.apply-release-blocker-fixes]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
      - run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('src/features/dress-editor/DressEditorPage.tsx')
          s=p.read_text()
          s=s.replace(
              'const next = { ...current, ...patch };\n      latestTransform.current = next;',
              'const next = { ...current, ...patch };\n      hasFace.current = true;\n      latestTransform.current = next;',
          )
          s=s.replace(
              '  const flushTransform = () => {\n    if (hasFace.current)\n      void patchDress(dressId, { faceTransform: latestTransform.current });\n  };',
              '  const flushTransform = () => {\n    void patchDress(dressId, { faceTransform: latestTransform.current });\n  };',
          )
          s=s.replace(
              'onClick={() => nav(`/tour/${tourId}/shop/${d.shopId}`)}',
              '''onClick={async () => {\n              await patchDress(dressId, {\n                memo: latestMemo.current,\n                label: latestLabel.current.trim() || d.label,\n                ...(data.face ? { faceTransform: latestTransform.current } : {}),\n              });\n              nav(`/tour/${tourId}/shop/${d.shopId}`);\n            }}''',
              1,
          )
          p.write_text(s)

          p=Path('e2e/mobile.spec.ts')
          s=p.read_text()
          s=s.replace(
              'test("portable PDF downloads, imports as a copy, and restores face data", async ({ page }) => {',
              'test("portable PDF downloads, imports as a copy, and restores face data", async ({ page }) => {\n  test.setTimeout(120_000);',
          )
          old='''  const cached = await page.evaluate(async () =>\n    Boolean(await caches.match("/index.html", { ignoreSearch: true })) &&\n    Boolean(await caches.match("/assets/option-atlas.webp", { ignoreSearch: true })),\n  );'''
          new='''  const cached = await page.evaluate(async () => {\n    const names = await caches.keys();\n    const requests = (\n      await Promise.all(\n        names.map(async (name) => (await caches.open(name)).keys()),\n      )\n    ).flat();\n    return (\n      requests.some((request) => request.url.includes("/index.html")) &&\n      requests.some((request) => request.url.includes("/assets/option-atlas.webp"))\n    );\n  });'''
          if old not in s:
              raise SystemExit('offline cache block missing')
          p.write_text(s.replace(old,new))
          PY
          rm -f .apply-release-blocker-fixes .github/workflows/apply-release-blocker-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve PDF timeout, offline cache, and face-save blockers"
          git push origin HEAD:fix/user-test-polish
