name: Import verified application source

on:
  push:
    branches: [master]
    paths:
      - .github/import-source.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Download and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --connect-timeout 20 --max-time 300 \
            --fail --location --silent --show-error \
            'https://filebin.net/dress-tour-note-prd-20260831/source-v2.tar.xz' \
            --output /tmp/dress-tour-note-v2.tar.xz
          echo '573f95345c9990c02d3eb89d3176ec145b030e009ada6c1a9032403c7391f9f9  /tmp/dress-tour-note-v2.tar.xz' | sha256sum --check

      - name: Replace repository source atomically
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dress-tour-note-source
          tar -xJf /tmp/dress-tour-note-v2.tar.xz -C /tmp/dress-tour-note-source
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/dress-tour-note-source/. .

      - name: Commit verified application
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: implement complete dress tour note PRD'
          git push origin HEAD:master
