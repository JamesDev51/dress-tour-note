name: Assemble PRD PDF

on:
  push:
    branches: [docs/prd-handoff]
    paths:
      - .prd-upload/ready

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/prd-handoff
          fetch-depth: 0
      - name: Assemble and verify PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat .prd-upload/part-* | base64 --decode > 'docs/드레스노트_현재기준_PRD_외부개발_인수인계_v1.1.pdf'
          echo '3d44a17c44e0f0def7af3ade72ac7c1a1c42be33776465d70016dbde315eb123  docs/드레스노트_현재기준_PRD_외부개발_인수인계_v1.1.pdf' | sha256sum --check
          test -s 'docs/드레스노트_현재기준_PRD_외부개발_인수인계_v1.1.pdf'
      - name: Commit final PRD only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .prd-upload .github/workflows/assemble-prd-pdf.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: add current Dress Note handoff PRD PDF'
          git push origin HEAD:docs/prd-handoff
