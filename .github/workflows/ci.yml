name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image fixture dependency
        run: python -m pip install pillow==12.3.0
      - name: Install locked dependencies
        run: npm ci
      - name: Security audit
        run: npm audit --audit-level=high
      - name: Formatting
        run: npm run format:check
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Validate option catalog
        run: npm run validate:option-catalog
      - name: Test option catalog validator
        run: npm run test:option-catalog-validator
      - name: Production build
        run: npm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install mobile browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Production build
        run: npm run build
      - name: Mobile browser E2E
        run: npm run test:e2e
