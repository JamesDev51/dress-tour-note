name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply canonical formatting
        run: npm run format

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Mobile end-to-end tests
        run: npm run test:e2e

      - name: Verify committed formatting
        run: git diff --exit-code

      - name: Upload production build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: dist
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload formatted source and lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            package.json
            package-lock.json
            index.html
            vercel.json
            tsconfig*.json
            vite.config.ts
            vitest.config.ts
            playwright.config.ts
            .prettierrc.json
            .prettierignore
            .gitignore
            README.md
            docs
            public
            src
            tests
            .github
          if-no-files-found: warn
          retention-days: 7
