name: Apply E2E race fixes

on:
  push:
    branches: [fix/user-test-polish]
    paths:
      - .e2e-race-fix-trigger

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
          fetch-depth: 0
      - name: Remove route races and verify the offline cache directly
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, expected=1):
              p=Path(path); text=p.read_text(encoding='utf-8'); count=text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected}, got {count} for {old!r}')
              p.write_text(text.replace(old,new), encoding='utf-8')

          robust_url='await expect(page).toHaveURL(/\\/tour\\/(?!new(?:\\/|$))[^/]+$/);'
          replace('e2e/mobile.spec.ts','await expect(page).toHaveURL(/\\/tour\\/[^/]+$/);',robust_url)
          replace('e2e/usability.spec.ts','await expect(page).toHaveURL(/\\/tour\\/[^/]+$/);',robust_url)

          replace(
            'e2e/mobile.spec.ts',
            '    const status = await page\n      .getByRole("status")\n      .textContent()\n      .catch(() => null);\n    if (status) return `status: ${status}`;',
            '    const alert = await page\n      .getByRole("alert")\n      .textContent()\n      .catch(() => null);\n    if (alert) return `alert: ${alert}`;\n    const status = await page\n      .getByRole("status")\n      .textContent()\n      .catch(() => null);\n    if (status) return `status: ${status}`;',
          )

          replace(
            'e2e/mobile.spec.ts',
            '  await page.evaluate(async () => {\n    await Promise.all([fetch("/"), fetch("/assets/options.svg")]);\n  });\n  await context.setOffline(true);\n  await page.goto("/?offline-test=1", { waitUntil: "domcontentloaded" });\n  await expect(page.getByText("그림 대신")).toBeVisible();',
            '  await page.evaluate(async () => {\n    await Promise.all([fetch("/"), fetch("/assets/options.svg")]);\n  });\n  await context.setOffline(true);\n  const cached = await page.evaluate(async () => {\n    const [shell, artwork] = await Promise.all([fetch("/"), fetch("/assets/options.svg")]);\n    return { shell: shell.ok, artwork: artwork.ok };\n  });\n  expect(cached).toEqual({ shell: true, artwork: true });\n  await expect(page.getByText("그림 대신")).toBeVisible();',
          )

          replace(
            'e2e/usability.spec.ts',
            '  await expect(page.locator(\'[data-option-art="top-offShoulder"]\')).toBeVisible();',
            '  const artwork = page.locator(\'[data-option-art="top-offShoulder"]\');\n  await expect(artwork).toBeVisible();\n  expect(await artwork.evaluate((node) => {\n    const use = node.querySelector("use");\n    if (!(use instanceof SVGGraphicsElement)) return false;\n    const box = use.getBBox();\n    return box.width > 0 && box.height > 0;\n  })).toBe(true);',
          )
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run format
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Commit fixes
        shell: bash
        run: |
          rm -f .e2e-race-fix-trigger .github/workflows/apply-e2e-race-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: remove mobile route races and verify cached shell"
          git push origin HEAD:fix/user-test-polish
