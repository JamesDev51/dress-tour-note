name: Final release quality gate

on:
  push:
    branches: [master]
    paths:
      - .github/final-quality.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout latest master
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Prettier
        run: npm run format:check

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Vitest
        run: npm test -- --run

      - name: Vite production build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright mobile E2E
        run: npm run test:e2e

      - name: Record verified release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          cat > docs/verification.md <<EOF
          # Release verification

          Verified source commit: $GITHUB_SHA

          Environment: GitHub-hosted Ubuntu / Node 22 / Chromium

          Passed checks:

          - Prettier format check
          - ESLint
          - TypeScript strict typecheck
          - Vitest unit, component, repository, renderer, and PDF round-trip tests
          - Vite production build
          - Playwright mobile end-to-end tests
          EOF
          rm -f .github/final-quality.trigger .github/workflows/release-quality-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nothing to record.'
            exit 0
          fi
          git commit -m 'test: record successful final release verification'
          git push origin HEAD:master
