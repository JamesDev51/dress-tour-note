name: Production deployment smoke test

on:
  push:
    branches: [test/production-smoke-20260901]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Diagnose production alias
        shell: bash
        run: |
          set -euo pipefail
          url="https://dress-tour-note-minseokjeongjames-4193s-projects.vercel.app"
          headers=$(mktemp)
          curl --location --silent --show-error --max-time 30 --dump-header "$headers" --output /tmp/home.html "$url/"
          echo "=== response headers ==="
          grep -Ei '^(HTTP/|content-type:|server:|x-vercel-|location:)' "$headers" || true
          echo "=== html title ==="
          grep -Eio '<title>[^<]*</title>' /tmp/home.html | head -1 || true
          echo "=== marker scan ==="
          grep -Eio 'Vercel|Authentication|Log in|Sign in|그드레스|드레스투어|Dress Tour Note|<div id="root"></div>' /tmp/home.html | head -20 || true
          echo "=== body prefix ==="
          tr '\n' ' ' < /tmp/home.html | head -c 1200 || true
          echo

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real production user journeys
        env:
          PRODUCTION_URL: https://dress-tour-note-minseokjeongjames-4193s-projects.vercel.app
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: |
            test-results
            playwright-production-report
          if-no-files-found: ignore
          retention-days: 7
