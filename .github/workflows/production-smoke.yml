name: Production deployment smoke test

on:
  push:
    branches: [test/production-smoke-20260901]

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PRODUCTION_URL: https://dress-tour-note.vercel.app
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Confirm the public production domain
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --location --silent --show-error --max-time 30 \
            --output /tmp/gudress-home.html --write-out '%{http_code}' "${PRODUCTION_URL}/")
          echo "HTTP ${code} from ${PRODUCTION_URL}"
          test "$code" = "200"
          test -s /tmp/gudress-home.html
          grep -q '<div id="root"></div>' /tmp/gudress-home.html

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real production user journeys
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: |
            test-results
            playwright-production-report
          if-no-files-found: ignore
          retention-days: 7
