name: Production deployment smoke test

on:
  push:
    branches: [test/production-smoke-20260901]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout test harness
        uses: actions/checkout@v4

      - name: Resolve the live production alias
        shell: bash
        run: |
          set -euo pipefail
          candidates=(
            "https://dress-tour-note-minseokjeongjames-4193s-projects.vercel.app"
            "https://dress-tour-note-git-master-minseokjeongjames-4193s-projects.vercel.app"
            "https://dress-tour-note.vercel.app"
          )
          for candidate in "${candidates[@]}"; do
            echo "Probing ${candidate}"
            headers=$(mktemp)
            code=$(curl --location --silent --show-error --max-time 30 \
              --dump-header "$headers" --output /tmp/gudress-home.html \
              --write-out '%{http_code}' "${candidate}/" || true)
            content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/{value=$0} END{sub(/^[^:]+:[[:space:]]*/,"",value); sub(/\r$/,"",value); print value}' "$headers")
            echo "HTTP ${code}; ${content_type:-unknown content type} from ${candidate}"
            if [ "$code" = "200" ] && [ -s /tmp/gudress-home.html ] && [[ "$content_type" == text/html* ]]; then
              echo "PRODUCTION_URL=${candidate}" >> "$GITHUB_ENV"
              echo "Resolved production URL: ${candidate}"
              exit 0
            fi
          done
          echo "No public production alias returned an HTML document."
          exit 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run real production user journeys
        run: npx playwright test --config=playwright.production.config.ts

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-evidence
          path: |
            test-results
            playwright-production-report
          if-no-files-found: ignore
          retention-days: 7
