name: Fix export trailer wiring
on:
  push:
    branches: [fix/user-test-polish]
    paths: [.fix-export-trailer]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
      - run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('src/lib/pdf/exportPdf.ts')
          s=p.read_text()
          if 'from "./portableTrailer"' not in s:
              s=s.replace('} from "./portable";\n', '} from "./portable";\nimport { appendPortableTrailer } from "./portableTrailer";\n')
          marker='''\n  if (portable) {\n    onProgress?.({ step: "attach", percent: 90, label: "복원 데이터 첨부" });'''
          replacement='''\n  let portableSerialized: Awaited<ReturnType<typeof serializePortableBundle>> | undefined;\n\n  if (portable) {\n    onProgress?.({ step: "attach", percent: 90, label: "복원 데이터 첨부" });'''
          if marker not in s:
              raise SystemExit('portable block marker missing')
          s=s.replace(marker,replacement,1)
          p.write_text(s)
          PY
          rm -f .fix-export-trailer .github/workflows/fix-export-trailer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: wire fast trailer into PDF export"
          git push origin HEAD:fix/user-test-polish
