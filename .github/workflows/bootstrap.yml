name: Bootstrap complete mobile app

on:
  push:
    branches: [feat/complete-mobile-app]
    paths:
      - .project-bundle-ready

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore complete source tree
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import hashlib
          import shutil
          import tarfile

          expected_parts = 6
          expected_sha256 = 'f9fcddf3d8780848d960b2805c5cb9ab707735baaa9fca357a8e8ac8e58ae9c5'
          parts = sorted(Path('.').glob('.project-bundle-part-*'))
          if len(parts) != expected_parts:
              raise SystemExit(f'Expected {expected_parts} bundle parts, found {len(parts)}')

          encoded = ''.join(part.read_text(encoding='utf-8').strip() for part in parts)
          archive_bytes = base64.b64decode(encoded, validate=True)
          actual_sha256 = hashlib.sha256(archive_bytes).hexdigest()
          if actual_sha256 != expected_sha256:
              raise SystemExit(f'Bundle checksum mismatch: {actual_sha256}')

          archive = Path('/tmp/dress-tour-note.tar.gz')
          archive.write_bytes(archive_bytes)

          for child in list(Path('.').iterdir()):
              if child.name == '.git':
                  continue
              if child.is_dir():
                  shutil.rmtree(child)
              else:
                  child.unlink()

          with tarfile.open(archive, 'r:gz') as bundle:
              for member in bundle.getmembers():
                  target = Path(member.name)
                  if target.is_absolute() or '..' in target.parts:
                      raise SystemExit(f'Unsafe archive member: {member.name}')
              bundle.extractall('.', filter='data')
          PY

      - name: Commit restored source tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: implement complete mobile dress tour app"
          git push origin HEAD:feat/complete-mobile-app
