name: Autofix and verify

on:
  push:
    branches: [master]
    paths:
      - .github/autofix.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autofix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Apply deterministic formatting
        run: npm run format

      - name: Apply safe lint fixes
        run: npm run lint -- --fix

      - name: Typecheck
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test -- --run

      - name: Build production bundle
        run: npm run build

      - name: Commit verified deterministic changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/autofix.trigger .github/workflows/autofix-and-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No deterministic changes to commit.'
            exit 0
          fi
          git commit -m 'chore: apply verified formatting and lockfile'
          git push origin HEAD:master
