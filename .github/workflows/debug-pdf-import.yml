name: Debug PDF import
on:
  push:
    branches: [fix/user-test-polish]
    paths: [.debug-pdf-import]
jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/user-test-polish
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Instrument and run portable PDF scenario
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('e2e/mobile.spec.ts')
          s=p.read_text()
          target='''  await page.locator('input[type="file"]').setInputFiles(path!);\n  await expectImportPreview(page, "E2E 드레스투어");'''
          replacement='''  await page.locator('input[type="file"]').setInputFiles(path!);\n  await page.waitForTimeout(2500);\n  console.log("[PDF_IMPORT_BODY]", await page.locator("body").innerText());\n  await expectImportPreview(page, "E2E 드레스투어");'''
          if target not in s:
              raise SystemExit('debug target missing')
          p.write_text(s.replace(target,replacement,1))
          PY
          npx playwright test e2e/mobile.spec.ts -g "portable PDF" --retries=0
