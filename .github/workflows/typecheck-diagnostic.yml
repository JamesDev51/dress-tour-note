name: Typecheck diagnostic

on:
  push:
    branches: [feat/generated-assets-final]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Capture TypeScript diagnostics
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          CODE=$?
          echo '## TypeScript diagnostics' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/typecheck.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            cp /tmp/typecheck.log TYPECHECK_ERRORS.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add TYPECHECK_ERRORS.txt
            git commit -m 'ci: capture TypeScript errors'
            git push origin HEAD:feat/generated-assets-final
          fi
          exit 0
